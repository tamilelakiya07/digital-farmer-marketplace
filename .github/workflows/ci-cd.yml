name: Digital Farmer Marketplace CI/CD

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:

  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check Flask application
        working-directory: backend
        run: python -m py_compile app.py


  automated-tests:
    name: Automated Tests
    runs-on: ubuntu-latest
    needs: backend-check

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install pytest
        run: pip install pytest

      - name: Run backend tests
        run: pytest tests/test_backend.py -v


  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend-check
      - automated-tests
      - frontend-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker containers
        run: docker compose build